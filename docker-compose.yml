# 投资理财助手（Invest Manager）容器编排
#
# 用法：
#   cp .env.example .env        # 填 INGEST_TOKEN / LLM_* / TAVILY_API_KEY（可含代理）
#   docker compose build
#   docker compose up -d
#   node scripts/smoke.mjs      # 冒烟（5 项）
#
# 端口与暴露面：仅 web 对外（${WEB_PORT:-3000}）；data-service 只在 compose 网络内；
#              MCP HTTP 为可选的 mcp profile，仅绑宿主机 127.0.0.1。

name: invest-manager

services:
  # ---------------- Next.js（页面 + BFF + Prisma/SQLite） ----------------
  web:
    build:
      context: ./web
      args:
        # docker.io 直连受限时用国内镜像前缀（可用环境变量覆盖）
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-bookworm-slim}
    image: invest-manager-web:local
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: Asia/Shanghai
      # SQLite 落在命名卷内（覆盖 web/.env 的开发态 file:./dev.db）
      DATABASE_URL: file:/app/data/dev.db
      DATA_SERVICE_URL: http://data-service:8000
      # 落库回调共享密钥：两侧同值；未设置时 compose 直接拒绝启动
      INGEST_TOKEN: ${INGEST_TOKEN:?必须在 .env 中设置 INGEST_TOKEN（ingest 回调共享密钥）}
      # LLM 与搜索：经 .env 注入，绝不写进镜像
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # P6 扩展机制（镜像内已含 skills/ 与 mcp.json，此处仅保留可覆盖项）
      SKILLS_DIR: ${SKILLS_DIR:-./skills}
      MCP_CONFIG: ${MCP_CONFIG:-./mcp.json}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - prisma-data:/app/data
    restart: unless-stopped
    networks: [app]

  # ---------------- FastAPI data-service（无状态数据适配层） ----------------
  data-service:
    build:
      context: ./data-service
      args:
        # 必须与锁文件生成环境一致（本地开发 venv 为 3.12）
        PY_IMAGE: ${PY_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
    image: invest-manager-data-service:local
    # data-service 的启动补跑与落库回调都需要 web 就绪（web 不反向依赖，故无环）
    depends_on:
      web:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # P6 起 data-service 有 4 条回调 web 的链路：
      #   热点落库 / 研报落库（research ingest）/ 研报回读 web /api/kline / MCP search_products
      WEB_BASE_URL: http://web:3000
      WEB_API_BASE: http://web:3000
      INGEST_TOKEN: ${INGEST_TOKEN:?必须在 .env 中设置 INGEST_TOKEN（ingest 回调共享密钥）}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEARCH_API_KEY: ${TAVILY_API_KEY:-}
      # 代理透传（R12 海外源）：宿主代理需写成 http://host.docker.internal:<port>；
      # NO_PROXY 必须包含服务名，否则容器间调用会被代理拦截
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,web,data-service}
    volumes:
      # dev 数据卷挂入：备份脚本以只读 URI 读取（一致性快照），
      # 恢复（--restore）需要写入，故此处必须 rw —— 恢复前务必先 `docker compose stop web`
      - prisma-data:/data
      # 备份输出目录（宿主机 bind mount）
      - ./backups:/backup
    expose:
      - "8000"          # 仅 compose 网络可达，不发布到宿主机
    restart: unless-stopped
    networks: [app]

  # ---------------- 可选：MCP HTTP server（供宿主机客户端调用） ----------------
  # 启动：docker compose --profile mcp up -d
  mcp:
    image: invest-manager-data-service:local
    profiles: [mcp]
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "-m", "app.mcp_server", "--http"]
    environment:
      TZ: Asia/Shanghai
      # 容器内必须监听 0.0.0.0：绑 127.0.0.1 时宿主机经端口映射也访问不到
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8765"
      WEB_API_BASE: http://web:3000
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,web,data-service}
    ports:
      - "127.0.0.1:8765:8765"   # 仅本机可访问
    restart: unless-stopped
    networks: [app]

volumes:
  prisma-data:

networks:
  app:
